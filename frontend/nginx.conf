server {
    listen 3000;

    location = /wpad.dat {
        access_log off;
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 3443 ssl;
    ssl_certificate /certs/frontend.crt;
    ssl_certificate_key /certs/frontend.key;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_server_name on;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(turni|permessi|timbrature|chat)/utente/ {
        return 403;
    }

    location /api/auth/ {
        proxy_pass https://auth-service:8081;
    }

    location /api/users {
        proxy_pass https://auth-service:8081;
    }

    location /api/timbrature {
        proxy_pass https://timbratura-service:8082;
    }

    location /api/permessi {
        proxy_pass https://permessi-service:8083;
    }

    location /api/turni {
        proxy_pass https://turni-service:8084;
    }

    location /api/chat {
        proxy_pass https://chat-service:8085;
    }

    location /ws {
        proxy_pass https://chat-service:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location = /wpad.dat {
        access_log off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
