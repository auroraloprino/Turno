x-servizio-java: &servizio-java
  env_file: .env
  volumes:
    - certs:/certs:ro

x-truststore: &truststore >-
  -Djavax.net.ssl.trustStore=/certs/truststore.p12
  -Djavax.net.ssl.trustStorePassword=changeit
  -Djavax.net.ssl.trustStoreType=PKCS12

services:
  certs-init:
    build: ./infrastruttura/certs
    container_name: turno-certs-init
    volumes:
      - certs:/certs
    network_mode: none
    restart: "no"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: turno-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [kafka-net]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo imok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: turno-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [kafka-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 15s
      timeout: 30s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: turno-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?manca KEYCLOAK_ADMIN_PASSWORD nel file .env}
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak.key
      TURNO_AUTH_CLIENT_SECRET: ${TURNO_AUTH_CLIENT_SECRET:?manca TURNO_AUTH_CLIENT_SECRET nel file .env}
      TURNO_ORCHESTRATORE_CLIENT_SECRET: ${TURNO_ORCHESTRATORE_CLIENT_SECRET:?manca TURNO_ORCHESTRATORE_CLIENT_SECRET nel file .env}
    ports:
      - "8180:8443"
    volumes:
      - ./infrastruttura/keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
      - certs:/certs:ro
    networks: [keycloak-net]
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  auth-service:
    <<: *servizio-java
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: turno-auth
    environment:
      MONGODB_URI: ${MONGODB_URI:?manca MONGODB_URI nel file .env}
      MONGODB_DATABASE: authdb
      KEYCLOAK_URL: https://keycloak:8443
      KAFKA_HOST: kafka
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /certs/auth-service.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /certs/auth-service.key
      JAVA_TOOL_OPTIONS: *truststore
    networks: [apigw-backend-net, keycloak-net, kafka-net]
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --cacert /certs/ca.crt https://localhost:8081/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  timbratura-service:
    <<: *servizio-java
    build:
      context: ./backend
      dockerfile: timbratura-service/Dockerfile
    container_name: turno-timbratura
    environment:
      MONGODB_URI: ${MONGODB_URI:?manca MONGODB_URI nel file .env}
      MONGODB_DATABASE: timbraturadb
      KEYCLOAK_URL: https://keycloak:8443
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /certs/timbratura-service.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /certs/timbratura-service.key
      JAVA_TOOL_OPTIONS: *truststore
    networks: [apigw-backend-net, servizi-net, keycloak-net]
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --cacert /certs/ca.crt https://localhost:8082/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  permessi-service:
    <<: *servizio-java
    build:
      context: ./backend
      dockerfile: permessi-service/Dockerfile
    container_name: turno-permessi
    environment:
      MONGODB_URI: ${MONGODB_URI:?manca MONGODB_URI nel file .env}
      MONGODB_DATABASE: permessidb
      KEYCLOAK_URL: https://keycloak:8443
      KAFKA_HOST: kafka
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /certs/permessi-service.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /certs/permessi-service.key
      JAVA_TOOL_OPTIONS: *truststore
    networks: [apigw-backend-net, servizi-net, keycloak-net, kafka-net]
    depends_on:
      certs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --cacert /certs/ca.crt https://localhost:8083/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  turni-service:
    <<: *servizio-java
    build:
      context: ./backend
      dockerfile: turni-service/Dockerfile
    container_name: turno-turni
    environment:
      MONGODB_URI: ${MONGODB_URI:?manca MONGODB_URI nel file .env}
      MONGODB_DATABASE: turnidb
      KEYCLOAK_URL: https://keycloak:8443
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /certs/turni-service.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /certs/turni-service.key
      JAVA_TOOL_OPTIONS: *truststore
    networks: [apigw-backend-net, servizi-net, keycloak-net]
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --cacert /certs/ca.crt https://localhost:8084/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  chat-service:
    <<: *servizio-java
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    container_name: turno-chat
    environment:
      MONGODB_URI: ${MONGODB_URI:?manca MONGODB_URI nel file .env}
      MONGODB_DATABASE: chatdb
      KEYCLOAK_URL: https://keycloak:8443
      KAFKA_HOST: kafka
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /certs/chat-service.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /certs/chat-service.key
      JAVA_TOOL_OPTIONS: *truststore
    networks: [apigw-backend-net, servizi-net, keycloak-net, kafka-net]
    depends_on:
      certs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --cacert /certs/ca.crt https://localhost:8085/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  orchestratore-service:
    build:
      context: ./backend
      dockerfile: orchestratore-service/Dockerfile
    container_name: turno-orchestratore
    volumes:
      - certs:/certs:ro
    environment:
      KEYCLOAK_URL: https://keycloak:8443
      TURNO_ORCHESTRATORE_CLIENT_SECRET: ${TURNO_ORCHESTRATORE_CLIENT_SECRET:?manca TURNO_ORCHESTRATORE_CLIENT_SECRET nel file .env}
      KAFKA_HOST: kafka
      TURNI_SERVICE_URL: https://turni-service:8084
      PERMESSI_SERVICE_URL: https://permessi-service:8083
      TIMBRATURA_SERVICE_URL: https://timbratura-service:8082
      CHAT_SERVICE_URL: https://chat-service:8085
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /certs/orchestratore-service.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /certs/orchestratore-service.key
      JAVA_TOOL_OPTIONS: *truststore
    networks: [servizi-net, keycloak-net, kafka-net]
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --cacert /certs/ca.crt https://localhost:8086/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  frontend:
    build: ./frontend
    container_name: turno-frontend
    ports:
      - "80:3000"
      - "443:3443"
    volumes:
      - certs:/certs:ro
    networks: [apigw-backend-net]
    depends_on:
      auth-service:
        condition: service_healthy
      timbratura-service:
        condition: service_healthy
      permessi-service:
        condition: service_healthy
      turni-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs --cacert /certs/ca.crt https://localhost:3443/ > /dev/null && ! curl -s -o /dev/null -w '%{http_code}' --cacert /certs/ca.crt https://localhost:3443/api/auth/login | grep -q 502",
        ]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 5s

  ready:
    image: nginx:1.27-alpine
    container_name: turno-ready
    network_mode: none
    depends_on:
      frontend:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - |
        printf ' Turno è pronto su locale:  https://localhost\n'
        printf ' Per testing: owner@turno.test/ Owner1234!\n'

volumes:
  keycloak_data:
  certs:

networks:
  apigw-backend-net:
    name: turno-apigw-backend-net
  servizi-net:
    name: turno-servizi-net
  kafka-net:
    name: turno-kafka-net
  keycloak-net:
    name: turno-keycloak-net
