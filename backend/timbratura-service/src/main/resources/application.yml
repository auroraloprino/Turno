spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:timbraturadb}
      auto-index-creation: true

keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: turno

server:
  port: 8082

springdoc:
  api-docs:
    path: /api/timbrature/v3/api-docs
  swagger-ui:
    path: /api/timbrature/swagger-ui.html
