spring:
  application:
    name: orchestratore-service
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    consumer:
      group-id: orchestratore-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.turno.orchestratore.kafka.UtenteCancellatoEvent
        spring.json.trusted.packages: "com.turno.orchestratore.kafka"

keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: turno
  client-id: turno-orchestratore
  client-secret: ${TURNO_ORCHESTRATORE_CLIENT_SECRET}

servizi:
  turni: ${TURNI_SERVICE_URL:http://localhost:8084}
  permessi: ${PERMESSI_SERVICE_URL:http://localhost:8083}
  timbrature: ${TIMBRATURA_SERVICE_URL:http://localhost:8082}
  chat: ${CHAT_SERVICE_URL:http://localhost:8085}

server:
  port: 8086
